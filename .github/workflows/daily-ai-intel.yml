name: Daily AI Defense Robotics Intel Bulletin

"on":
  schedule:
    # Türkiye saati 09:17 = UTC 06:17
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  send-daily-intel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show current UTC time
        run: date -u

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily AI intel bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BULLETIN_MODE: daily
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash-lite,gemini-2.0-flash' }}
          MAX_CANDIDATES: ${{ vars.MAX_CANDIDATES || '35' }}
          BULLETIN_ITEMS: ${{ vars.BULLETIN_ITEMS || '5' }}
          ARXIV_MAX_QUERIES: ${{ vars.ARXIV_MAX_QUERIES || '4' }}
          SEMANTIC_SCHOLAR_MAX_QUERIES: ${{ vars.SEMANTIC_SCHOLAR_MAX_QUERIES || '2' }}
          ENABLE_PWC: ${{ vars.ENABLE_PWC || 'false' }}
        run: python main.py