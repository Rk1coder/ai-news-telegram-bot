name: Weekly AI Defense Robotics Trend Report

on:
  schedule:
    # Her pazar Türkiye saati 17:00 = UTC 14:00
    - cron: "0 14 * * 0"
  workflow_dispatch:

jobs:
  send-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send weekly report
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

          BULLETIN_MODE: weekly
          GEMINI_MODEL: ${{ vars.WEEKLY_GEMINI_MODEL || 'gemini-2.5-pro' }}
          GEMINI_FALLBACK_MODELS: ${{ vars.GEMINI_FALLBACK_MODELS || 'gemini-2.5-flash,gemini-2.5-flash-lite,gemini-2.0-flash' }}
          GEMINI_MAX_RETRIES: ${{ vars.GEMINI_MAX_RETRIES || '3' }}

          MAX_AGE_HOURS: ${{ vars.WEEKLY_MAX_AGE_HOURS || '168' }}
          MAX_CANDIDATES: ${{ vars.WEEKLY_MAX_CANDIDATES || '45' }}
          BULLETIN_ITEMS: ${{ vars.WEEKLY_BULLETIN_ITEMS || '10' }}
          REQUEST_TIMEOUT: ${{ vars.REQUEST_TIMEOUT || '25' }}
          ARXIV_MAX_QUERIES: ${{ vars.ARXIV_MAX_QUERIES || '4' }}
          ARXIV_DELAY_SECONDS: ${{ vars.ARXIV_DELAY_SECONDS || '3.5' }}
          SEMANTIC_SCHOLAR_MAX_QUERIES: ${{ vars.SEMANTIC_SCHOLAR_MAX_QUERIES || '2' }}
          SEMANTIC_SCHOLAR_DELAY_SECONDS: ${{ vars.SEMANTIC_SCHOLAR_DELAY_SECONDS || '4.0' }}
          ENABLE_PWC: ${{ vars.ENABLE_PWC || 'false' }}
        run: python main.py
